name: Check for YFull Tree Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bump to the latest YFull tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/bump_ytree.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ytree-update
          title: Bump YFull tree
          commit-message: Bump YFull tree
          body: Opened automatically by the Check for YFull Tree Update workflow.
